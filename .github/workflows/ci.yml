name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  package-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [
          "apps/admin-react",
          "apps/web-react",
          "services/auth",
          "services/listings",
          "services/documents",
          "services/verification"
        ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & test package
        working-directory: ${{ matrix.path }}
        run: |
          echo "Checking package at: $PWD"
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No package.json in ${PWD}, skipping"
          fi
